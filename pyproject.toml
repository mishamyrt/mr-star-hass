[project]
name = "mr_star_hass"
authors = [
    {name = "Mikhael Khrustik", email = "misha@myrt.co"},
]
description = "Integrating MR Star light into Home Assistant."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["light", "led", "bleak"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
version = "2.0.0"

[tool.ruff]
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
lint.ignore = [
    "E501",  # line too long, handled by pylint
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]